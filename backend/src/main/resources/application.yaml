spring:
  application:
    name: platform
  datasource:
    # No defaults on purpose: outside the "local" profile, missing variables fail startup.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Max wait (ms) to borrow a pooled connection; bounds request and health-check latency when the DB is down.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  error:
    # Boot defaults, made explicit: error responses never expose internals.
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          # Not ready to serve traffic without the database. Liveness stays livenessState only.
          include: readinessState, db
